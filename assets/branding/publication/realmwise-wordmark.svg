<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 480" role="img" aria-labelledby="title desc">
  <title id="title">Realmwise RPG Tracker wordmark</title>
  <desc id="desc">A gold Realmwise wordmark with a compass star and RPG Tracker subtitle.</desc>
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff4bd"/>
      <stop offset="0.42" stop-color="#f8c94f"/>
      <stop offset="1" stop-color="#a96d0d"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#051737" flood-opacity="0.9"/>
    </filter>
  </defs>
  <g fill="url(#gold)" stroke="#071c43" stroke-width="10" paint-order="stroke" filter="url(#shadow)">
    <text x="800" y="270" text-anchor="middle" font-family="Cinzel, Georgia, serif" font-size="230" font-weight="700" letter-spacing="-8">Realmwise</text>
  </g>
  <g transform="translate(820 63)" fill="url(#gold)" stroke="#071c43" stroke-width="5" paint-order="stroke">
    <path d="M0-45 12-12 45 0 12 12 0 45-12 12-45 0-12-12Z"/>
    <circle r="12" fill="#fff4bd"/>
  </g>
  <g fill="url(#gold)" stroke="#071c43" stroke-width="3" paint-order="stroke">
    <path d="M245 355h220l18 12-18 12H245l-18-12Z"/>
    <path d="M1135 355h220l18 12-18 12h-220l-18-12Z"/>
    <text x="800" y="390" text-anchor="middle" font-family="Georgia, serif" font-size="60" font-weight="700" letter-spacing="18">RPG TRACKER</text>
  </g>
</svg>
