name: Publish Production Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing draft v* release to publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-release-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: production-release
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Verify and publish the existing draft release
        shell: bash
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]
          gh release view "$RELEASE_TAG" --json isDraft,isPrerelease > "$RUNNER_TEMP/release.json"
          if [[ "$(jq -r '.isDraft' "$RUNNER_TEMP/release.json")" != 'true' || "$(jq -r '.isPrerelease' "$RUNNER_TEMP/release.json")" == 'true' ]]; then
            echo "Release $RELEASE_TAG must exist as a non-prerelease draft." >&2
            exit 1
          fi
          gh release edit "$RELEASE_TAG" --draft=false
