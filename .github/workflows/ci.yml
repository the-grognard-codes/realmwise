name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.2'

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get --enforce-lockfile
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .
      - name: Analyze
        run: flutter analyze
      - name: Run tests
        run: flutter test
      - name: Validate SBOM matches lockfile
        run: python3 .github/scripts/validate_sbom.py

  build-windows:
    name: build-windows
    needs: validate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Build Windows smoke artifact
        run: flutter build windows --release

  build-linux:
    name: build-linux
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install --yes ninja-build libgtk-3-dev libsecret-1-dev
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Build Linux smoke artifact
        run: flutter build linux --release

  build-android:
    name: build-android
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Build Android smoke artifact
        run: flutter build apk --debug

  artifact-roundtrip:
    name: artifact-roundtrip
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Create smoke artifact
        run: printf 'Realmwise artifact smoke test\n' > artifact-smoke.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: artifact-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifact-smoke.txt
          if-no-files-found: error
          retention-days: 1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: artifact-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: downloaded
      - name: Verify downloaded artifact
        run: cmp artifact-smoke.txt downloaded/artifact-smoke.txt
