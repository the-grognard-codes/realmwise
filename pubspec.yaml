name: realmwise
description: A local-first catalog for tabletop role-playing game books.
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.12.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  archive: ^3.6.1
  crypto: ^3.0.3
  file_picker: ^11.0.2
  http: ^1.2.2
  intl: ^0.19.0
  mobile_scanner: ^5.2.3
  path: ^1.9.0
  path_provider: ^2.1.5
  permission_handler: ^11.3.1
  shared_preferences: ^2.3.3
  flutter_secure_storage: ^9.2.4
  sqflite: ^2.4.1
  sqflite_common_ffi: ^2.3.4+4
  xml: ^6.5.0
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  path_provider_platform_interface: ^2.1.2
  #sqflite_common_ffi: ^2.3.4+4

flutter:
  uses-material-design: true
  assets:
    - assets/branding/publication/
