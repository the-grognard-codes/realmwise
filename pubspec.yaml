name: realmwise
description: A local-first catalog for tabletop role-playing game books.
publish_to: none
version: 1.3.0+6

environment:
  sdk: '>=3.13.0 <4.0.0'
  flutter: '>=3.47.9'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^2.0.0
  archive: ^4.6.0
  crypto: ^3.0.8
  file_picker: ^13.3.2
  http: ^1.6.0
  intl: ^0.20.3
  mobile_scanner: ^7.5.0
  path: ^1.9.1
  path_provider: ^2.1.6
  package_info_plus: ^10.2.2
  permission_handler: ^13.0.2
  shared_preferences: ^2.5.6
  flutter_secure_storage: ^11.2.0
  sqflite: ^2.4.6
  sqflite_common_ffi: ^2.4.6
  xml: ^7.1.0
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  path_provider_platform_interface: ^2.1.3

flutter:
  uses-material-design: true
  assets:
    - assets/branding/publication/
    - assets/icons/
    - assets/placeholders/
