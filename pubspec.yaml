name: realmwise
description: A local-first catalog for tabletop role-playing game books.
publish_to: none
version: 1.0.3+1

environment:
  sdk: '>=3.12.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  archive: ^4.2.0
  crypto: ^3.0.3
  file_picker: ^12.1.2
  http: ^1.2.2
  intl: ^0.20.3
  mobile_scanner: ^7.4.0
  path: ^1.9.0
  path_provider: ^2.1.5
  package_info_plus: ^10.2.1
  permission_handler: ^13.0.1
  shared_preferences: ^2.3.3
  flutter_secure_storage: ^11.0.0
  sqflite: ^2.4.1
  sqflite_common_ffi: ^2.3.4+4
  xml: ^7.0.1
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  path_provider_platform_interface: ^2.1.2
  #sqflite_common_ffi: ^2.3.4+4

flutter:
  uses-material-design: true
  assets:
    - assets/branding/publication/
