openapi: 3.0.3
info:
  title: RPG Catalog Debug Harness API
  version: 1.0.0
  description: >-
    Opt-in loopback-only debug service. Swagger is available at / and this
    contract at /openapi.json. API keys are writeOnly, never persisted by
    requests, returned, or logged.
servers:
  - url: http://127.0.0.1:8080
paths:
  /lookup/openlibrary:
    get:
      parameters:
        - {name: isbn, in: query, schema: {type: string}}
        - {name: title, in: query, schema: {type: string}}
        - {name: author, in: query, schema: {type: string}}
        - {name: ownerName, in: query, schema: {type: string}}
        - {name: ownerEmail, in: query, schema: {type: string, format: email}}
      responses:
        '200': {description: Results envelope, content: {application/json: {schema: {$ref: '#/components/schemas/Results'}}}}
        '400': {description: Invalid request, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '503': {description: Upstream unavailable, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /lookup/rpggeek:
    post:
      summary: Enrich a candidate with RPGGeek
      description: >-
        Searches RPGGeek with the full candidate title and, when applicable,
        a subtitle-stripped fallback. Results are de-duplicated and scored
        against the title; the best match is fetched from detail XML (including
        stats) and merged. An empty key or upstream failure returns the
        original candidate unchanged (fail-open). The API key is writeOnly and
        is never returned or logged.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [candidate]
              properties:
                apiKey: {type: string, format: password, writeOnly: true}
                candidate: {$ref: '#/components/schemas/Candidate'}
      responses:
        '200':
          description: Result envelope containing the enriched (or unchanged) candidate
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Result'}
              example:
                ok: true
                result:
                  title: Dungeons & Dragons
                  rpgGeekId: '12345'
                  rpgGeekUrl: https://rpggeek.com/rpgitem/12345
                  publisher: Wizards of the Coast
                  publicationDate: '2014'
                  summary: Core rulebook
                  remoteCoverUrl: https://example.invalid/cover.jpg
        '400': {description: Invalid request, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '503': {description: Upstream unavailable, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /openapi.json:
    get:
      responses:
        '200': {description: This OpenAPI document}
components:
  schemas:
    Error:
      type: object
      required: [ok, error]
      properties:
        ok: {type: boolean, enum: [false]}
        error: {type: string}
    Candidate:
      type: object
      description: >-
        A catalog work candidate and optional remote metadata. Nonempty RPGGeek
        title, publisher, publicationDate, summary, and remoteCoverUrl values
        override Open Library values; OpenLibrary-only fields such as ISBN and
        authors, plus any RPGGeek-absent fields, remain.
      properties:
        title: {type: string}
        isbn13: {type: string}
        authors: {type: array, items: {type: string}}
        publisher: {type: string}
        publicationDate: {type: string}
        summary: {type: string}
        pageCount: {type: integer, nullable: true}
        remoteCoverUrl: {type: string}
        openLibraryId: {type: string}
        rpgGeekId: {type: string}
        rpgGeekUrl: {type: string, format: uri, nullable: true, readOnly: true, description: Public RPGGeek item page derived from rpgGeekId.}
        gameSystem: {type: string}
        gameSetting: {type: string}
        bookType: {type: string}
        moreInfo: {type: string}
        designers: {type: array, items: {type: string}}
        artists: {type: array, items: {type: string}}
        productionStaff: {type: array, items: {type: string}}
        version: {type: string}
        isbn: {type: string}
        productCode: {type: string}
        seriesCode: {type: string}
        dimensions: {type: string}
        series: {type: array, items: {type: string}}
        setting: {type: array, items: {type: string}}
        family: {type: array, items: {type: string}}
        system: {type: array, items: {type: string}}
        category: {type: array, items: {type: string}}
        mechanics: {type: array, items: {type: string}}
        genre: {type: array, items: {type: string}}
    Results:
      type: object
      required: [ok, results]
      properties:
        ok: {type: boolean, enum: [true]}
        results: {type: array, items: {$ref: '#/components/schemas/Candidate'}}
    Result:
      type: object
      required: [ok, result]
      properties:
        ok: {type: boolean, enum: [true]}
        result: {$ref: '#/components/schemas/Candidate'}
